name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full suite at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same PR
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the Vite dev server itself
      # (webServer) with VITE_USE_MOCK_DATA=true.
      - name: Run full suite (nightly / manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run e2e

      - name: Run smoke suite (push / PR)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run e2e:smoke

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
