<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6e2f6" />
    <title>QuizApp</title>
    <script>
      // Apply the persisted theme before first paint (no flash of the
      // wrong theme). Mirrors src/app/settings-store.ts storage shape.
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('quiz-settings') || '{}')
          var setting = (stored.state && stored.state.theme) || 'system'
          var dark =
            setting === 'dark' ||
            (setting !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = root.dataset.theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#211d33' : '#e6e2f6')
          if (stored.state && stored.state.animations === false) {
            root.dataset.motion = 'off'
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
